<article><h1>城市更新的十年</h1>
<p>过去十年，城市更新从拆除重建转向微更新。老旧小区加装电梯、街道口袋公园、社区食堂等项目，让居民切实感受到变化。</p>
<p>专家指出，下一阶段的重点是存量空间的精细化运营，以及公众参与机制的完善。</p>
<h2>典型案例</h2>
<p>上海的“一江一河”滨水空间贯通工程，已向市民开放超过一百公里岸线。</p>
